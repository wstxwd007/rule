name: Sync Zashboard Release

on:
  schedule:
    # 每天北京时间 9:17 执行
    - cron: "17 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-zashboard-release
  cancel-in-progress: false

jobs:
  sync-zashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check and download latest Zashboard release
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TARGET_DIR="ui"
          TARGET_FILE="$TARGET_DIR/zashboard-dist-no-fonts.zip"
          STATE_FILE="$TARGET_DIR/.zashboard-release-state"

          RELEASE_JSON="$RUNNER_TEMP/zashboard-release.json"
          TEMP_FILE="$RUNNER_TEMP/zashboard-dist-no-fonts.zip"

          API_URL="https://api.github.com/repos/Zephyruso/zashboard/releases/latest"

          mkdir -p "$TARGET_DIR"

          echo "Checking latest Zashboard release..."

          curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -o "$RELEASE_JSON"

          TAG_NAME="$(jq -r '.tag_name // empty' "$RELEASE_JSON")"

          ASSET_JSON="$(
            jq -c '
              .assets[]
              | select(.name == "dist-no-fonts.zip")
            ' "$RELEASE_JSON" |
            head -n 1
          )"

          if [ -z "$TAG_NAME" ]; then
            echo "Unable to determine latest release tag."
            exit 1
          fi

          if [ -z "$ASSET_JSON" ]; then
            echo "dist-no-fonts.zip was not found in release $TAG_NAME."
            exit 1
          fi

          ASSET_ID="$(jq -r '.id' <<< "$ASSET_JSON")"
          ASSET_SIZE="$(jq -r '.size' <<< "$ASSET_JSON")"
          ASSET_UPDATED_AT="$(jq -r '.updated_at' <<< "$ASSET_JSON")"
          DOWNLOAD_URL="$(jq -r '.browser_download_url' <<< "$ASSET_JSON")"

          RELEASE_STATE="${TAG_NAME}|${ASSET_ID}|${ASSET_UPDATED_AT}|${ASSET_SIZE}"
          CURRENT_STATE=""

          if [ -f "$STATE_FILE" ]; then
            CURRENT_STATE="$(cat "$STATE_FILE")"
          fi

          echo "Latest release: $TAG_NAME"
          echo "Asset ID:       $ASSET_ID"
          echo "Asset size:     $ASSET_SIZE"
          echo "Asset updated:  $ASSET_UPDATED_AT"

          if [ -f "$TARGET_FILE" ] &&
             [ "$CURRENT_STATE" = "$RELEASE_STATE" ]; then
            echo "Zashboard release is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New or replaced release asset detected."
          echo "Downloading dist-no-fonts.zip..."

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 300 \
            "$DOWNLOAD_URL" \
            -o "$TEMP_FILE"

          if [ ! -s "$TEMP_FILE" ]; then
            echo "Downloaded file is empty."
            exit 1
          fi

          ACTUAL_SIZE="$(stat -c '%s' "$TEMP_FILE")"

          if [ "$ACTUAL_SIZE" != "$ASSET_SIZE" ]; then
            echo "Downloaded file size mismatch."
            echo "Expected: $ASSET_SIZE"
            echo "Actual:   $ACTUAL_SIZE"
            exit 1
          fi

          echo "Checking ZIP archive..."

          unzip -tq "$TEMP_FILE"

          echo "Downloaded file:"
          ls -lh "$TEMP_FILE"
          sha256sum "$TEMP_FILE"

          mv -f "$TEMP_FILE" "$TARGET_FILE"
          printf '%s\n' "$RELEASE_STATE" > "$STATE_FILE"

          echo "Zashboard mirror updated:"
          ls -lh "$TARGET_FILE"
          sha256sum "$TARGET_FILE"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.download.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.download.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ui/zashboard-dist-no-fonts.zip \
            ui/.zashboard-release-state

          if git diff --cached --quiet; then
            echo "No effective changes."
            exit 0
          fi

          git commit -m "Sync Zashboard ${RELEASE_TAG}"
          git push
